---
remoteFiles:
  - url: https://github.com/Homebrew/brew/releases/latest/download/Homebrew.pkg
    checkPath: brew
  - url: https://github.com/containers/podman/releases/download/v5.8.1/podman-installer-macos-universal.pkg
    checkPath: podman
  - url: https://release.files.ghostty.org/1.3.1/Ghostty.dmg
    appName: Ghostty.app
  - url: https://dl.google.com/chrome/mac/universal/stable/GGRO/googlechrome.dmg
    appName: Google Chrome.app
  - url: https://slack.com/ssb/download-osx-universal
    appName: Slack.app

links:
  - source: .zshrc
    destination: ~/.zshrc
  - source: nvim
    destination: ~/.config/nvim
  - source: ghostty
    destination: ~/.config/ghostty
